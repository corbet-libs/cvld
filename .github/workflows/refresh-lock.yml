name: Refresh dependency lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_HTTP_USER_AGENT: dependency-lock-ci
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Resolve the declared revisions
        run: |
          cargo update --workspace
          if [ -f fuzz/Cargo.toml ]; then cargo update --workspace --manifest-path fuzz/Cargo.toml; fi
      - run: python3 .github/check-first-party.py
      - name: Generate the public contract from the action registry
        run: |
          cargo run --locked -- openapi > docs/openapi.json
          npm ci --prefix clients/ts
          npm run generate --prefix clients/ts
          npm run check --prefix clients/ts
          npm test --prefix clients/ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refreshed-lock
          path: |
            Cargo.lock
            fuzz/Cargo.lock
            docs/openapi.json
            clients/ts/schema.d.ts
