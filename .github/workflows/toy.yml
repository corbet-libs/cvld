name: Toy model
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Finish the running build so parallel door pushes cannot discard its compiler
# cache. GitHub coalesces queued revisions; this workflow never publishes.
concurrency:
  group: cvld-toy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  toy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
      CARGO_HTTP_USER_AGENT: cvld-toy-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
          shared-key: toy
      - name: Install child-process test clock
        run: sudo apt-get update -qq && sudo apt-get install -y libfaketime
      - run: rustc --version
      - name: Build public CLI and toy holder
        run: toy/build.sh
      - name: Check toy formatting
        run: rustfmt --edition 2024 --check toy/src/*.rs
      - name: Run every readable scenario
        run: |
          set -o pipefail
          mkdir -p toy/reports
          target/debug/cvld-toy scenarios | tee toy/reports/transcript.txt
      - name: Measure 200 holders across five communities
        run: |
          set -o pipefail
          target/debug/cvld-toy scale | tee toy/reports/scale.txt
      - name: Confirm optional Turso run stays opt-in
        run: target/debug/cvld-toy turso
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: toy-results
          path: |
            toy/reports/
            toy/.build/Cargo.lock
