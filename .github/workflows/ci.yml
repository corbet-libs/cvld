name: Rust door
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cvld-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustc --version
      - run: cargo update --workspace
      - run: python3 scripts/check-leaves.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --features development-gate -- -D warnings
      - run: cargo test --locked --features development-gate
      - run: cargo test --locked --release
      - name: Prove development gate cannot enter a release binary
        run: |
          if cargo check --locked --release --features development-gate > release-gate.log 2>&1; then exit 1; fi
          grep -q 'development-gate is forbidden in release builds' release-gate.log
      - name: Regenerate protocol and client
        run: |
          cargo run --locked --release -- openapi > docs/openapi.json
          npm ci --prefix clients/ts
          npm run generate --prefix clients/ts
          npm run check --prefix clients/ts
          git ls-files --error-unmatch docs/openapi.json clients/ts/schema.d.ts
          git diff --exit-code -- docs/openapi.json clients/ts/schema.d.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated
          path: |
            Cargo.lock
            docs/openapi.json
            clients/ts/schema.d.ts
