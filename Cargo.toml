[package]
name = "cvld"
version = "0.2.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cvld"
description = "The permanent door of the cmtymeet trust stack"
publish = false

[features]
default = []
development-gate = ["cglb/development-gate"]

[dependencies]
cmty = { git = "https://github.com/corbet-libs/cmty", branch = "main" }
clbs = { git = "https://github.com/corbet-foss/clbs", branch = "main" }
ed25519-dalek = "2.2"
cpsd = { git = "https://github.com/corbet-foss/cpsd", branch = "main", default-features = false, features = ["storage"] }
crlt = { git = "https://github.com/corbet-foss/crlt", branch = "main" }
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", features = ["libsql"] }
cglb = { git = "https://github.com/corbet-libs/cglb", branch = "main" }
cpky = { git = "https://github.com/corbet-foss/cpky", branch = "main" }
cthl = { git = "https://github.com/corbet-foss/cthl", branch = "main" }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["cors"] }
utoipa = "6.0.0"
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
rmcp = { version = "3.5.0", features = ["server", "client", "transport-io", "transport-child-process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
rand = "0.8"
thiserror = "2"
zeroize = "1.9"
subtle = "2.6"

[dev-dependencies]
passkey = "0.4"
async-trait = "0.1"
cvch = { git = "https://github.com/corbet-foss/cvch", branch = "main" }
cpns = { git = "https://github.com/corbet-foss/cpns", branch = "main" }
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"
