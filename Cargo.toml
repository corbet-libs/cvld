[package]
name = "cvld"
version = "0.2.0"
edition = "2024"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cvld"
description = "The permanent door of the cmtymeet trust stack"
publish = false

[features]
default = []
development-gate = ["cglb/development-gate"]

[dependencies]
cmnt = { git = "https://github.com/corbet-libs/cmnt", rev = "eea1a8083ce137607cc03f28c348c73345a6a06f" }
clbs = { git = "https://github.com/corbet-foss/clbs", rev = "873f2dd7388c6d5e025a27b4c55447c4b4892a2d" }
ed25519-dalek = "2.2"
cpsd = { git = "https://github.com/corbet-foss/cpsd", rev = "0d314b97bce9aeaffb5424159e8255ce34acee1e", default-features = false, features = ["storage"] }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "80dc046d6ab53b3ea530c45bf3d7038c8b2c61b2" }
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "3ea958b522a15fecf65630aae1f9944135105497", features = ["libsql"] }
cglb = { git = "https://github.com/corbet-libs/cglb", rev = "f6fc32ff2a0f5b71147df8fe277ca908d04e4ad7" }
cpky = { git = "https://github.com/corbet-foss/cpky", rev = "65f93bb78d103d9ee3c25b80ed873130ecf2a6d7" }
cthl = { git = "https://github.com/corbet-foss/cthl", rev = "a41533a255cefc0757078205bff87c03e6c7bbbe" }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["cors"] }
utoipa = "6.0.0"
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
rmcp = { version = "3.5.0", features = ["server", "client", "transport-io", "transport-child-process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
rand = "0.8"
thiserror = "2"
zeroize = "1.9"
subtle = "2.6"

[dev-dependencies]
cvch = { git = "https://github.com/corbet-foss/cvch", rev = "37ee0cba6c8be767c8e8ecd286ec225a21b564e1" }
cpns = { git = "https://github.com/corbet-foss/cpns", rev = "d68a3f3a2df322c513d0e754e452ee02aab7a5b9" }
tempfile = "3"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"
